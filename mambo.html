<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#030407">
  <title>KHUNOSE_OS // A Love Beyond Measure</title>
  <style>
    :root {
      color-scheme: dark;
      --g: #39ff78;
      --c: #00eaff;
      --m: #ff4fdb;
      --gold: #ffd866;
      --bg: #030407
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--g);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      -webkit-tap-highlight-color: transparent
    }

    body {
      isolation: isolate
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
      user-select: none
    }

    canvas:active {
      cursor: grabbing
    }

    #grid,
    #vignette,
    #scanlines,
    #sweep {
      position: fixed;
      inset: 0;
      pointer-events: none
    }

    #grid {
      z-index: 2;
      background-image: linear-gradient(rgba(0, 255, 170, .024) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 170, .024) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent)
    }

    #vignette {
      z-index: 6;
      background: radial-gradient(ellipse at 50% 48%, transparent 28%, rgba(0, 0, 0, .38) 66%, rgba(0, 0, 0, .88) 100%)
    }

    #scanlines {
      z-index: 7;
      opacity: .42;
      background: repeating-linear-gradient(to bottom, rgba(0, 255, 170, .045) 0 1px, transparent 1px 4px)
    }

    #sweep {
      z-index: 7;
      height: 140px;
      background: linear-gradient(to bottom, transparent, rgba(0, 255, 170, .055), transparent);
      animation: sweep 9s linear infinite
    }

    @keyframes sweep {
      from {
        transform: translateY(-160px)
      }

      to {
        transform: translateY(calc(100vh + 160px))
      }
    }

    .corner {
      position: fixed;
      width: 22px;
      height: 22px;
      z-index: 9;
      pointer-events: none;
      border: 1px solid rgba(57, 255, 120, .42)
    }

    .corner.tl {
      top: 13px;
      left: 13px;
      border-right: 0;
      border-bottom: 0
    }

    .corner.tr {
      top: 13px;
      right: 13px;
      border-left: 0;
      border-bottom: 0
    }

    .corner.bl {
      bottom: 13px;
      left: 13px;
      border-right: 0;
      border-top: 0
    }

    .corner.br {
      bottom: 13px;
      right: 13px;
      border-left: 0;
      border-top: 0
    }

    #hud {
      position: fixed;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      font-size: 10px;
      letter-spacing: 1.8px;
      line-height: 1.9;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(57, 255, 120, .14)
    }

    #hud .dim {
      color: rgba(57, 255, 120, .4)
    }

    #hud .cy {
      color: var(--c)
    }

    #hud .mg {
      color: var(--m)
    }

    #hud-tl {
      position: absolute;
      top: 27px;
      left: 30px
    }

    #hud-tr {
      position: absolute;
      top: 27px;
      right: 30px;
      text-align: right
    }

    #hud-bl {
      position: absolute;
      bottom: 27px;
      left: 30px
    }

    .blink {
      animation: blink 1.05s steps(1) infinite
    }

    @keyframes blink {
      50% {
        opacity: 0
      }
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 0 22px clamp(154px, 20vh, 195px)
    }

    #text-box {
      width: 100%;
      max-width: 830px;
      padding: 14px 18px 17px;
      border-left: 2px solid rgba(57, 255, 120, .58);
      background: linear-gradient(90deg, rgba(0, 255, 170, .07), rgba(0, 0, 0, 0) 90%);
      opacity: 0;
      transform: translateY(16px);
      transition: opacity .38s ease, transform .38s ease;
      contain: layout style
    }

    #text-box.show {
      opacity: 1;
      transform: translateY(0)
    }

    #text-box .lbl {
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--g);
      text-shadow: 0 0 12px rgba(57, 255, 120, .65);
      margin-bottom: 9px
    }

    #text-box .main {
      font-size: clamp(12px, 2.05vw, 17px);
      color: #c7f8ff;
      line-height: 1.7;
      text-shadow: 0 0 15px rgba(0, 234, 255, .35);
      margin-bottom: 8px
    }

    #text-box .cmp {
      font-size: clamp(13px, 2.2vw, 19px);
      color: var(--m);
      line-height: 1.58;
      text-shadow: 0 0 19px rgba(255, 79, 219, .5);
      letter-spacing: .25px;
      font-weight: 700
    }

    #text-box .fin {
      font-size: clamp(12px, 2.05vw, 17px);
      color: #ffb0e9;
      line-height: 1.68;
      text-shadow: 0 0 12px rgba(255, 157, 226, .35);
      margin: 4px 0
    }

    #text-box .name {
      font-size: clamp(22px, 4vw, 36px);
      color: var(--gold);
      letter-spacing: clamp(2px, .6vw, 6px);
      text-shadow: 0 0 25px rgba(255, 216, 102, .8), 0 0 65px rgba(255, 157, 226, .35);
      margin: 13px 0 10px;
      font-weight: 800
    }

    #text-box .sig {
      color: #ffb0e9;
      font-size: 12px;
      letter-spacing: 2.5px;
      margin-top: 14px;
      text-shadow: 0 0 15px rgba(255, 157, 226, .5)
    }

    .cur {
      display: inline-block;
      width: 8px;
      height: 13px;
      margin-left: 3px;
      background: var(--g);
      vertical-align: -1px;
      animation: blink 1s steps(1) infinite;
      box-shadow: 0 0 9px rgba(57, 255, 120, .7)
    }

    #scale-bar {
      position: fixed;
      right: 25px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 220px;
      background: rgba(57, 255, 120, .12);
      z-index: 10;
      overflow: hidden;
      border-radius: 2px
    }

    #scale-fill {
      width: 100%;
      height: 0%;
      background: linear-gradient(to top, var(--c), var(--g), var(--m));
      box-shadow: 0 0 12px rgba(0, 234, 255, .75);
      transition: height .45s ease
    }

    #scale-label {
      position: fixed;
      right: 36px;
      top: 50%;
      transform: translateY(-50%) rotate(90deg);
      font-size: 9px;
      color: rgba(57, 255, 120, .4);
      letter-spacing: 4px;
      white-space: nowrap;
      z-index: 10
    }

    #next-btn {
      position: fixed;
      bottom: 69px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      z-index: 120;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 42%, rgba(57, 255, 120, .22), rgba(57, 255, 120, .035));
      border: 1px solid rgba(57, 255, 120, .7);
      color: var(--g);
      font-size: 27px;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      box-shadow: 0 0 20px rgba(57, 255, 120, .24), inset 0 0 18px rgba(57, 255, 120, .09);
      transition: background .2s, box-shadow .2s, transform .15s, opacity .25s;
      animation: btnPulse 2.8s ease-in-out infinite;
      touch-action: manipulation;
      opacity: 1;
      pointer-events: auto
    }

    #next-btn:hover {
      background: radial-gradient(circle at 50% 42%, rgba(57, 255, 120, .4), rgba(57, 255, 120, .08));
      box-shadow: 0 0 30px rgba(57, 255, 120, .42), inset 0 0 20px rgba(57, 255, 120, .18)
    }

    #next-btn:active {
      transform: translateX(-50%) scale(.92)
    }

    #next-btn:focus-visible {
      outline: 2px solid var(--g);
      outline-offset: 4px
    }

    @keyframes btnPulse {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(57, 255, 120, .24), inset 0 0 18px rgba(57, 255, 120, .09)
      }

      50% {
        box-shadow: 0 0 32px rgba(57, 255, 120, .42), inset 0 0 22px rgba(57, 255, 120, .14)
      }
    }

    #next-label {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      letter-spacing: 4px;
      color: rgba(57, 255, 120, .65);
      text-transform: uppercase;
      z-index: 120;
      pointer-events: none;
      white-space: nowrap
    }

    #progress-dots {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      z-index: 10;
      opacity: 0;
      transition: opacity .3s
    }

    .dot {
      width: 11px;
      height: 2px;
      background: rgba(57, 255, 120, .18);
      transition: background .25s, width .25s
    }

    .dot.active {
      background: var(--g);
      box-shadow: 0 0 8px var(--g);
      width: 19px
    }

    .dot.done {
      background: rgba(0, 234, 255, .55)
    }

    #progress-dots.show {
      opacity: 1
    }

    #drag-hint {
      position: fixed;
      top: 50%;
      left: 23px;
      transform: translateY(-50%) rotate(-90deg);
      font-size: 9px;
      letter-spacing: 4px;
      color: rgba(57, 255, 120, .35);
      text-transform: uppercase;
      z-index: 9;
      pointer-events: none;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .5s
    }

    #drag-hint.show {
      opacity: 1
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(ellipse at 50% 43%, #100717 0%, #050308 42%, #020304 78%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      padding: 24px;
      text-align: left;
      transition: opacity .55s ease;
      isolation: isolate
    }

    #start:before {
      content: "";
      position: absolute;
      inset: 8%;
      border: 1px solid rgba(255, 79, 219, .11);
      clip-path: polygon(0 0, 18% 0, 18% 1px, 1px 1px, 1px 18%, 0 18%, 0 0, 100% 0, 100% 18%, calc(100% - 1px) 18%, calc(100% - 1px) 1px, 82% 1px, 82% 0, 100% 0, 100% 100%, 82% 100%, 82% calc(100% - 1px), calc(100% - 1px) calc(100% - 1px), calc(100% - 1px) 82%, 100% 82%, 100% 100%, 0 100%, 0 82%, 1px 82%, 1px calc(100% - 1px), 18% calc(100% - 1px), 18% 100%, 0 100%);
      pointer-events: none
    }

    #start.hide {
      opacity: 0;
      pointer-events: none
    }

    #boot-title {
      font-size: clamp(17px, 3.6vw, 34px);
      color: #ffb0e9;
      letter-spacing: clamp(3px, 1.2vw, 8px);
      text-shadow: 0 0 30px rgba(255, 157, 226, .65), 0 0 70px rgba(255, 79, 219, .3);
      margin-bottom: 7px;
      text-align: center
    }

    #boot-sub {
      font-size: clamp(9px, 1.7vw, 12px);
      color: var(--gold);
      letter-spacing: clamp(3px, 1vw, 8px);
      text-shadow: 0 0 20px rgba(255, 216, 102, .5);
      margin-bottom: 28px;
      text-align: center
    }

    #boot {
      width: 100%;
      max-width: 600px;
      font-size: clamp(10px, 1.8vw, 13px);
      line-height: 1.95;
      color: var(--g);
      letter-spacing: 1px;
      white-space: pre-wrap;
      text-shadow: 0 0 10px rgba(57, 255, 120, .4);
      min-height: 166px
    }

    #boot .ok {
      color: var(--c)
    }

    #boot .mg {
      color: var(--m)
    }

    #boot .gd {
      color: var(--gold)
    }

    #boot-prompt {
      margin-top: 19px;
      color: var(--m);
      font-size: 10px;
      letter-spacing: 3px;
      opacity: 0;
      transition: opacity .4s;
      text-align: center;
      width: 100%;
      text-shadow: 0 0 16px rgba(255, 79, 219, .6)
    }

    #boot-prompt.show {
      opacity: .8;
      animation: pulse 2s infinite
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: .35
      }

      50% {
        opacity: 1
      }
    }

    @media(max-width:560px) {

      #scale-bar,
      #scale-label,
      #drag-hint {
        display: none
      }

      #ui {
        padding: 0 12px clamp(142px, 22vh, 170px)
      }

      #hud {
        font-size: 9px;
        letter-spacing: 1px
      }

      #hud-tl {
        top: 18px;
        left: 18px
      }

      #hud-tr {
        top: 18px;
        right: 18px
      }

      .corner {
        width: 14px;
        height: 14px
      }

      #hud-bl {
        display: none
      }

      #next-btn {
        width: 54px;
        height: 54px;
        bottom: 63px;
        font-size: 23px
      }

      #next-label {
        bottom: 33px
      }

      #text-box {
        padding: 12px 12px 13px
      }

      #text-box .lbl {
        letter-spacing: 2.5px
      }

      #boot {
        min-height: 155px;
        letter-spacing: .4px
      }

      #boot-title {
        letter-spacing: 3px
      }
    }

    @media(prefers-reduced-motion:reduce) {

      #sweep,
      .blink,
      .cur,
      #next-btn,
      #boot-prompt {
        animation: none
      }

      #text-box,
      #scale-fill {
        transition: none
      }
    }
  </style>
</head>

<body>
  <canvas id="c" aria-label="Interactive cosmic particle sculpture"></canvas>
  <div id="grid"></div>
  <div id="vignette"></div>
  <div id="scanlines"></div>
  <div id="sweep"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div id="hud">
    <div id="hud-tl">
      <div><span class="dim">SYS</span> KHUNOSE_OS <span class="dim">v3.1</span></div>
      <div><span class="dim">SEQ</span> <span class="cy" id="hud-seq">00</span><span class="dim">/</span><span
          class="dim" id="hud-tot">12</span></div>
      <div><span class="dim">TGT</span> <span class="mg" id="hud-target">----</span></div>
    </div>
    <div id="hud-tr">
      <div><span id="hud-state" class="dim">STANDBY</span> <span class="blink">▌</span></div>
      <div class="dim">LINK <span class="cy" id="hud-link">STABLE</span></div>
    </div>
    <div id="hud-bl">
      <div class="dim" id="hud-scale">SCALE ----</div>
    </div>
  </div>
  <div id="scale-bar">
    <div id="scale-fill"></div>
  </div>
  <div id="scale-label">MORPH // SCALE</div>
  <div id="progress-dots"></div>
  <div id="ui">
    <div id="text-box"></div>
  </div>
  <!-- The same control is visible above the boot overlay. Its first click initializes scene 1. -->
  <button id="next-btn" aria-label="Initialize KHUNOSE OS"><span id="next-icon">▶</span></button>
  <div id="next-label">initialize</div>
  <div id="drag-hint">drag to rotate</div>
  <div id="start">
    <div id="boot-title">PRINCESS KHUNOSE</div>
    <div id="boot-sub">A LOVE BEYOND MEASURE</div>
    <div id="boot"></div>
    <div id="boot-prompt">[ PRESS THE BUTTON TO INITIALIZE ]</div>
  </div>
  <script>
    'use strict';
    (() => {
      const TAU = Math.PI * 2, $ = id => document.getElementById(id);
      const canvas = $('c'), ctx = canvas.getContext('2d', {alpha: false, desynchronized: true});
      const TB = $('text-box'), SF = $('scale-fill'), START = $('start'), DOTS = $('progress-dots'), BOOT = $('boot'), BOOTP = $('boot-prompt'), NEXT_BTN = $('next-btn'), NEXT_ICON = $('next-icon'), NEXT_LBL = $('next-label'), DRAG_HINT = $('drag-hint');
      const HUD_SEQ = $('hud-seq'), HUD_TOT = $('hud-tot'), HUD_TARGET = $('hud-target'), HUD_STATE = $('hud-state'), HUD_SCALE = $('hud-scale'), HUD_LINK = $('hud-link');
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      function hsl2rgb(h, s, l) {h = ((h % 360) + 360) % 360; const c = (1 - Math.abs(2 * l - 1)) * s, hp = h / 60, x = c * (1 - Math.abs(hp % 2 - 1)); let r = 0, g = 0, b = 0; if (hp < 1) {r = c; g = x} else if (hp < 2) {r = x; g = c} else if (hp < 3) {g = c; b = x} else if (hp < 4) {g = x; b = c} else if (hp < 5) {r = x; b = c} else {r = c; b = x} const m = l - c / 2; return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)]}
      const intCache = new Map();
      function hc(h, s, l) {const H = Math.round((((h % 360) + 360) % 360) / 12) * 12 % 360, S = Math.round(s / 10) * 10, L = Math.round(l / 10) * 10, key = H * 10000 + S * 100 + L; let c = intCache.get(key); if (c !== undefined) return c; const rgb = hsl2rgb(H, S / 100, L / 100); c = (rgb[0] << 16) | (rgb[1] << 8) | rgb[2]; intCache.set(key, c); return c}
      const SPRITE_SIZE = 18, sprites = [], spriteColors = [], spriteCss = [], spriteMap = new Map(), buckets = [], activeBuckets = [];
      function buildSprite(c) {const cv = document.createElement('canvas'); cv.width = cv.height = SPRITE_SIZE; const g = cv.getContext('2d'); const r = c >> 16 & 255, gg = c >> 8 & 255, b = c & 255, h = SPRITE_SIZE / 2, gr = g.createRadialGradient(h, h, 0, h, h, h); gr.addColorStop(0, `rgba(${r},${gg},${b},.9)`); gr.addColorStop(.32, `rgba(${r},${gg},${b},.32)`); gr.addColorStop(1, `rgba(${r},${gg},${b},0)`); g.fillStyle = gr; g.fillRect(0, 0, SPRITE_SIZE, SPRITE_SIZE); return cv}
      function getSpriteIdx(c) {let id = spriteMap.get(c); if (id !== undefined) return id; id = sprites.length; spriteMap.set(c, id); sprites.push(buildSprite(c)); spriteColors.push(c); spriteCss.push(`rgb(${c >> 16 & 255},${c >> 8 & 255},${c & 255})`); buckets.push([]); activeBuckets.push(id); return id}
      let W = 0, H = 0, cx = 0, cy = 0, DPR = 1, SC = 1;

        for (let i = 0; i < N; i++) {if (i < carry && ox) {PX[i] = ox[i]; PY[i] = oy[i]; PZ[i] = oz[i]} else {PX[i] = Math.random() * W; PY[i] = Math.random() * H; PZ[i] = (Math.random() - .5) * 120} TX[i] = cx; TY[i] = cy; TZ[i] = 0; SZ[i] = 1.2; PH[i] = Math.random() * TAU; KK[i] = .095 + Math.random() * .035; DD[i] = .84 + Math.random() * .04; SPR[i] = white}
      }
      function resize() {DPR = Math.min(window.devicePixelRatio || 1, 1.35); W = window.innerWidth; H = window.innerHeight; canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR); canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); cx = W * .5; cy = H * .5; SC = clamp(Math.min(W, H) / 760, .65, 1.6); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.fillStyle = '#020304'; ctx.fillRect(0, 0, W, H); buildStars(); realloc(desiredParticles()); if (running && scene >= 0) assignScene(scene, false)}
